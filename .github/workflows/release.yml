name: Build and Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: easyget-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to origin/main
        shell: pwsh
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch origin/main for release ancestry validation."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -eq 1) {
            throw "Release commit '$($env:GITHUB_SHA)' is not reachable from origin/main. Formal releases must originate from main."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to validate release commit ancestry against origin/main."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must use vX.Y.Z format."
          }

          $version = $tag.Substring(1)
          [xml]$project = Get-Content -Raw -Encoding UTF8 -LiteralPath "EasyGet.csproj"
          $projectVersion = $project.Project.PropertyGroup |
            ForEach-Object { $_.Version } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if ($projectVersion -ne $version) {
            throw "Version mismatch: tag '$tag' but EasyGet.csproj <Version> is '$projectVersion'."
          }

      - name: Restore
        run: |
          dotnet restore EasyGet.csproj
          dotnet restore EasyGet.Tests/EasyGet.Tests.csproj

      - name: Test
        run: dotnet test EasyGet.Tests/EasyGet.Tests.csproj -c Release --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.19.0

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          ./scripts/build-installer.ps1 -Configuration Release -Runtime win-x64 -Version $version -SkipTests

      - name: Detect code signing configuration
        id: code_signing
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Code signing is partially configured. Set both WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 and WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD, or remove both."
          }

          if (-not $hasCertificate) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Code signing disabled::No code-signing certificate secrets are configured; release artifacts will remain unsigned."
            return
          }

          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Sign Windows release artifacts
        if: steps.code_signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "easyget-code-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)
            [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
            ./scripts/sign-release.ps1 -Version $version -CertificatePath $certificatePath
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Verify update manifest
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $releaseDir = "artifacts/publish/Release"
          $setup = Get-Item "$releaseDir/EasyGet-Setup-v$version.exe"
          $zip = Get-Item "$releaseDir/EasyGet-win-x64-Release.zip"
          $manifestPath = "$releaseDir/easyget-update.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Missing update manifest: $manifestPath"
          }

          $manifest = Get-Content -Raw -Encoding UTF8 -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "Manifest version mismatch: expected '$version' but got '$($manifest.version)'."
          }
          if ($manifest.tag -ne "${env:GITHUB_REF_NAME}") {
            throw "Manifest tag mismatch: expected '${env:GITHUB_REF_NAME}' but got '$($manifest.tag)'."
          }
          if ($manifest.setupAsset -ne $setup.Name -or [long]$manifest.setupSize -ne $setup.Length) {
            throw "Manifest setup asset does not match generated installer."
          }
          if ($manifest.zipAsset -ne $zip.Name -or [long]$manifest.zipSize -ne $zip.Length) {
            throw "Manifest zip asset does not match generated portable zip."
          }
          $setupHash = Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName
          $zipHash = Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName
          if ($manifest.setupSha256 -ne $setupHash.Hash) {
            throw "Manifest setup hash does not match generated installer."
          }
          if ($manifest.zipSha256 -ne $zipHash.Hash) {
            throw "Manifest zip hash does not match generated portable zip."
          }

      - name: Generate SPDX SBOM
        shell: pwsh
        run: |
          $sbomToolVersion = "4.1.5"
          $sbomToolSha256 = "625767B371B7FDD58F40F618B8A86DA0247A33C89E419039C86B4EDBA1DAD4B5"
          $sbomToolPath = Join-Path $env:RUNNER_TEMP "sbom-tool-win-x64.exe"
          $sbomToolUrl = "https://github.com/microsoft/sbom-tool/releases/download/v$sbomToolVersion/sbom-tool-win-x64.exe"
          Invoke-WebRequest -Uri $sbomToolUrl -OutFile $sbomToolPath
          $actualToolHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sbomToolPath).Hash
          if ($actualToolHash -ne $sbomToolSha256) {
            throw "Microsoft SBOM Tool checksum verification failed."
          }

          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/Release/win-x64"
          & $sbomToolPath generate `
            -b $publishDir `
            -bc $env:GITHUB_WORKSPACE `
            -pn "EasyGet" `
            -pv $version `
            -ps "zzf-857" `
            -nsb "https://github.com/${env:GITHUB_REPOSITORY}" `
            -V Verbose
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft SBOM Tool failed with exit code $LASTEXITCODE."
          }

          $generatedSbom = Join-Path $publishDir "_manifest/spdx_2.2/manifest.spdx.json"
          $releaseSbom = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/Release/EasyGet-v$version.spdx.json"
          if (-not (Test-Path -LiteralPath $generatedSbom -PathType Leaf)) {
            throw "Microsoft SBOM Tool did not produce the expected SPDX document."
          }
          $sbom = Get-Content -Raw -Encoding UTF8 -LiteralPath $generatedSbom | ConvertFrom-Json
          if ($sbom.spdxVersion -ne "SPDX-2.2" -or -not $sbom.packages) {
            throw "Generated SBOM is not a populated SPDX 2.2 document."
          }
          Copy-Item -LiteralPath $generatedSbom -Destination $releaseSbom -Force
          Remove-Item -LiteralPath (Join-Path $publishDir "_manifest") -Recurse -Force

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/artifacts/publish/Release/EasyGet-Setup-${{ github.ref_name }}.exe
            ${{ github.workspace }}/artifacts/publish/Release/EasyGet-win-x64-Release.zip
            ${{ github.workspace }}/artifacts/publish/Release/easyget-update.json
            ${{ github.workspace }}/artifacts/publish/Release/EasyGet-${{ github.ref_name }}.spdx.json

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/artifacts/publish/Release/EasyGet-Setup-${{ github.ref_name }}.exe
            ${{ github.workspace }}/artifacts/publish/Release/EasyGet-win-x64-Release.zip
          sbom-path: ${{ github.workspace }}/artifacts/publish/Release/EasyGet-${{ github.ref_name }}.spdx.json

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## " version " - ") == 1 { capture = 1 }
            capture && /^## / && index($0, "## " version " - ") != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "EasyGet ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Verify remote tag still targets this commit
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $directRef = "refs/tags/$tag"
          $peeledRef = "$directRef^{}"
          $remoteRefs = @(git ls-remote --tags origin $directRef $peeledRef)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read remote release tag '$tag'."
          }

          $remoteTagCommit = $null
          foreach ($line in $remoteRefs) {
            $parts = $line -split "`t", 2
            if ($parts.Count -eq 2 -and $parts[1] -eq $peeledRef) {
              $remoteTagCommit = $parts[0]
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($remoteTagCommit)) {
            foreach ($line in $remoteRefs) {
              $parts = $line -split "`t", 2
              if ($parts.Count -eq 2 -and $parts[1] -eq $directRef) {
                $remoteTagCommit = $parts[0]
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($remoteTagCommit)) {
            throw "Remote release tag '$tag' no longer exists."
          }
          if (-not $remoteTagCommit.Equals($env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Remote release tag '$tag' targets '$remoteTagCommit', not workflow commit '$($env:GITHUB_SHA)'. Refusing to publish a moved tag."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: |
            artifacts/publish/Release/EasyGet-Setup-${{ github.ref_name }}.exe
            artifacts/publish/Release/EasyGet-win-x64-Release.zip
            artifacts/publish/Release/easyget-update.json
            artifacts/publish/Release/EasyGet-${{ github.ref_name }}.spdx.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $expectedSetupAsset = "EasyGet-Setup-v$version.exe"
          $expectedZipAsset = "EasyGet-win-x64-Release.zip"
          $expectedManifestAsset = "easyget-update.json"
          $expectedSbomAsset = "EasyGet-v$version.spdx.json"
          $requiredAssets = @(
            $expectedSetupAsset,
            $expectedZipAsset,
            $expectedManifestAsset,
            $expectedSbomAsset
          )
          $maxAttempts = 12

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $tagReleaseJson = @(gh api "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$tag" 2>&1)
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub API could not read release '$tag': $($tagReleaseJson -join ' ')"
              }
              $tagRelease = ($tagReleaseJson -join "`n") | ConvertFrom-Json
              if ($tagRelease.draft -or -not $tagRelease.immutable -or $tagRelease.tag_name -ne $tag) {
                throw "Release '$tag' is missing, mutable, still a draft, or points at a different tag."
              }

              $latestJson = @(gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest" 2>&1)
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub API could not read the latest release: $($latestJson -join ' ')"
              }
              $latestRelease = ($latestJson -join "`n") | ConvertFrom-Json
              if ($latestRelease.draft -or -not $latestRelease.immutable -or $latestRelease.tag_name -ne $tag) {
                throw "Latest release is '$($latestRelease.tag_name)' instead of immutable '$tag', or it is still a draft."
              }

              $assetNames = @($latestRelease.assets | ForEach-Object { $_.name })
              foreach ($requiredAsset in $requiredAssets) {
                if ($requiredAsset -notin $assetNames) {
                  throw "Latest release '$tag' does not contain required asset '$requiredAsset'."
                }
              }

              $cacheBuster = "$($env:GITHUB_RUN_ID)-$attempt"
              $manifestUri = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/latest/download/easyget-update.json?release-check=$cacheBuster"
              $manifest = Invoke-RestMethod `
                -Method Get `
                -Uri $manifestUri `
                -Headers @{
                  "Cache-Control" = "no-cache"
                  "Pragma" = "no-cache"
                  "User-Agent" = "EasyGet-release-verifier"
                } `
                -TimeoutSec 30 `
                -ErrorAction Stop
              if ($manifest.version -ne $version) {
                throw "Latest manifest version is '$($manifest.version)' instead of '$version'."
              }
              if ($manifest.tag -ne $tag) {
                throw "Latest manifest tag is '$($manifest.tag)' instead of '$tag'."
              }
              if ($manifest.setupAsset -ne $expectedSetupAsset -or $manifest.zipAsset -ne $expectedZipAsset) {
                throw "Latest manifest asset names do not match release '$tag'."
              }
              if ([long]$manifest.setupSize -le 0 -or [long]$manifest.zipSize -le 0) {
                throw "Latest manifest contains an invalid asset size."
              }
              if ($manifest.setupSha256 -notmatch '^[A-Fa-f0-9]{64}$' -or
                  $manifest.zipSha256 -notmatch '^[A-Fa-f0-9]{64}$') {
                throw "Latest manifest contains an invalid SHA-256 value."
              }

              $setupReleaseAsset = $latestRelease.assets |
                Where-Object { $_.name -eq $expectedSetupAsset } |
                Select-Object -First 1
              $zipReleaseAsset = $latestRelease.assets |
                Where-Object { $_.name -eq $expectedZipAsset } |
                Select-Object -First 1
              if ([long]$manifest.setupSize -ne [long]$setupReleaseAsset.size -or
                  [long]$manifest.zipSize -ne [long]$zipReleaseAsset.size) {
                throw "Latest manifest sizes do not match the GitHub Release assets."
              }

              $setupDigest = [string]$setupReleaseAsset.digest
              $zipDigest = [string]$zipReleaseAsset.digest
              if ([string]::IsNullOrWhiteSpace($setupDigest) -or
                  [string]::IsNullOrWhiteSpace($zipDigest)) {
                throw "GitHub Release assets do not expose SHA-256 digests."
              }
              if (-not $setupDigest.Equals("sha256:$($manifest.setupSha256)", [StringComparison]::OrdinalIgnoreCase) -or
                  -not $zipDigest.Equals("sha256:$($manifest.zipSha256)", [StringComparison]::OrdinalIgnoreCase)) {
                throw "Latest manifest SHA-256 values do not match the GitHub Release asset digests."
              }

              $clientManifestUri = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/latest/download/easyget-update.json"
              $clientManifest = Invoke-RestMethod `
                -Method Get `
                -Uri $clientManifestUri `
                -Headers @{
                  "Cache-Control" = "no-cache"
                  "Pragma" = "no-cache"
                  "User-Agent" = "EasyGet-release-verifier"
                } `
                -TimeoutSec 30 `
                -ErrorAction Stop
              if ($clientManifest.version -ne $version -or $clientManifest.tag -ne $tag) {
                throw "The exact manifest URL used by installed clients still reports '$($clientManifest.tag)' / '$($clientManifest.version)' instead of '$tag' / '$version'."
              }

              Write-Host "Published release '$tag' is immutable, public, latest, and the exact client manifest URL exposes the new version."
              return
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw "Published release verification failed after $maxAttempts attempts: $($_.Exception.Message)"
              }

              Write-Warning "Published release is not consistent yet (attempt $attempt/$maxAttempts): $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
